name: Deploy reference site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "a_new_world.html"
      - "a_new_world_columns.html"
      - "resources/images/icons/**"
      - "artifacts/validation/visual_art/**/crops/**"
      - "artifacts/validation/visual_art/**/thumbs/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site/resources/images/icons _site/resources/images/textures
          cp a_new_world.html _site/index.html
          cp a_new_world.html _site/a_new_world.html
          # Civ review column view (horizontal-scroll one-column-per-civ).
          if [ -f a_new_world_columns.html ]; then
            cp a_new_world_columns.html _site/a_new_world_columns.html
          fi
          # Only the icon trees the HTML references — keeps the artifact small.
          for d in cards flags singleplayer units; do
            if [ -d "resources/images/icons/$d" ]; then
              cp -r "resources/images/icons/$d" "_site/resources/images/icons/$d"
            fi
          done
          # Page background (Poly Haven CC0 wood panel) — referenced by a_new_world.html.
          if [ -d resources/images/textures ]; then
            cp -r resources/images/textures/. _site/resources/images/textures/
          fi
          # Visual capture thumbnails and crops for the lightbox modal.
          # Deployed URL base: /artifacts/visual_art/<civ>/thumbs/ and .../crops/
          # Generator references these as artifacts/visual_art/... (relative to _site root).
          if [ -d artifacts/validation/visual_art ]; then
            mkdir -p _site/artifacts
            cp -r artifacts/validation/visual_art _site/artifacts/visual_art
          fi
          # A tiny .nojekyll so Pages doesn't try to process the tree.
          touch _site/.nojekyll
          du -sh _site
          find _site -type f | wc -l

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
